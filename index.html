<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧排班系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* 隱藏彈出視窗的捲軸以保持版面整潔 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* 提示訊息 (Toast) 動畫 */
        @keyframes slideInUp {
            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { transform: translate(-50%, 0); opacity: 1; }
            to { transform: translate(-50%, 10%); opacity: 0; }
        }
        .toast-enter {
            animation: slideInUp 0.3s ease-out forwards;
        }
        .toast-exit {
            animation: fadeOut 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col p-4 md:p-8 relative">

    <div class="max-w-5xl mx-auto w-full bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col h-full relative">
        
        <!-- 頂部區塊：月份切換與總時數統計 -->
        <header class="bg-indigo-600 text-white p-6 rounded-t-2xl shadow-md z-10 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex flex-col items-center md:items-start gap-4">
                <div class="flex items-center gap-4">
                    <button id="prevMonth" class="p-2 bg-indigo-500 hover:bg-indigo-400 rounded-full transition w-10 h-10 flex items-center justify-center">
                        &larr;
                    </button>
                    <h1 id="monthYearDisplay" class="text-2xl font-bold w-48 text-center tracking-wider"></h1>
                    <button id="nextMonth" class="p-2 bg-indigo-500 hover:bg-indigo-400 rounded-full transition w-10 h-10 flex items-center justify-center">
                        &rarr;
                    </button>
                </div>
                <div class="flex gap-2 mt-2 md:mt-0">
                    <button id="autoScheduleBtn" class="bg-blue-500 hover:bg-blue-400 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        智慧排班
                    </button>
                    <button id="clearMonthBtn" class="bg-red-500 hover:bg-red-400 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        清除本月
                    </button>
                </div>
            </div>
            
            <div class="flex flex-col items-center md:items-end w-full md:w-auto">
                <div class="text-sm uppercase tracking-wide opacity-80 mb-1">本月累積時數 (目標 96 小時)</div>
                <div class="flex items-baseline gap-2">
                    <span id="totalHoursText" class="text-4xl font-bold">0.00</span>
                    <span class="text-lg opacity-80">/ 96 小時</span>
                </div>
                <!-- 時數進度條 -->
                <div class="w-full bg-indigo-800 rounded-full h-3 mt-3 overflow-hidden shadow-inner">
                    <div id="progressBar" class="bg-red-400 h-3 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
                </div>
            </div>
        </header>

        <!-- 月曆主要網格 -->
        <main class="flex-1 p-4 md:p-6 bg-gray-50 flex flex-col">
            <!-- 星期標題 -->
            <div class="grid grid-cols-7 gap-2 mb-2 text-center font-semibold text-gray-500 text-sm md:text-base">
                <div class="text-red-500">日 (Sun)</div>
                <div>一 (Mon)</div>
                <div>二 (Tue)</div>
                <div>三 (Wed)</div>
                <div>四 (Thu)</div>
                <div>五 (Fri)</div>
                <div class="text-red-500">六 (Sat)</div>
            </div>
            <!-- 日期網格 (由 JavaScript 動態生成) -->
            <div id="calendarGrid" class="grid grid-cols-7 gap-2 flex-1 auto-rows-fr">
            </div>
        </main>
    </div>

    <!-- 選擇班別的彈出視窗 (Modal) -->
    <div id="shiftModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300 backdrop-blur-sm p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden transform scale-95 transition-transform duration-300 flex flex-col max-h-[90vh]" id="shiftModalContent">
            <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-gray-50 shrink-0">
                <div>
                    <h2 class="text-xl font-bold text-gray-800">選擇班別</h2>
                    <p id="modalDateDisplay" class="text-sm text-gray-500 mt-1"></p>
                </div>
                <button id="closeModalBtn" class="text-gray-400 hover:text-gray-600 transition p-2 rounded-full hover:bg-gray-200">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="p-5 overflow-y-auto no-scrollbar flex-1" id="shiftOptionsContainer">
                <!-- 班別選項 (由 JavaScript 動態生成) -->
            </div>
            
            <div class="p-4 border-t border-gray-100 bg-gray-50 flex justify-between items-center shrink-0">
                <button id="clearShiftBtn" class="px-4 py-2 text-red-600 hover:bg-red-50 rounded-lg transition font-medium text-sm flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    清除此日班別
                </button>
                <button id="cancelModalBtn" class="px-5 py-2 bg-gray-200 hover:bg-gray-300 text-gray-800 rounded-lg transition font-medium">
                    取消
                </button>
            </div>
        </div>
    </div>

    <!-- 提示訊息容器 (Toast Notification) -->
    <div id="toastContainer" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-50 hidden max-w-sm w-full text-center">
        <div class="bg-red-600 text-white px-6 py-3 rounded-xl shadow-2xl flex items-center justify-center gap-3">
            <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span id="toastMessage" class="font-medium text-sm text-left"></span>
        </div>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        // --- 班別定義 ---
        const SHIFTS = {
            // 休假
            'OFF': { id: 'OFF', name: '休假', type: 'off', time: '全日休息', bg: 'bg-red-50', border: 'border-red-300', text: 'text-red-700', calc: () => 0 },

            // 平日班別 (藍色)
            'W_A': { id: 'W_A', name: 'A班', type: 'weekday', time: '06:50 - 12:15', bg: 'bg-blue-100', border: 'border-blue-300', text: 'text-blue-800', calc: () => 5 + 25/60 },
            'W_B': { id: 'W_B', name: 'B班', type: 'weekday', time: '12:05 - 17:30', bg: 'bg-blue-100', border: 'border-blue-300', text: 'text-blue-800', calc: () => 5 + 25/60 },
            'W_C': { id: 'W_C', name: 'C班', type: 'weekday', time: '17:20 - 22:00', bg: 'bg-blue-100', border: 'border-blue-300', text: 'text-blue-800', calc: () => 4 + 40/60 },
            'W_E': { id: 'W_E', name: 'E班', type: 'weekday', time: '16:00 - 20:00', bg: 'bg-blue-100', border: 'border-blue-300', text: 'text-blue-800', calc: () => 4 },
            'W_D': { id: 'W_D', name: 'D班', type: 'weekday', time: '22:00 - 07:00', bg: 'bg-blue-100', border: 'border-blue-300', text: 'text-blue-800', calc: () => 9 },
            
            // 假日班別 (綠色)
            'H_A': { id: 'H_A', name: 'A班 (假日)', type: 'weekend', time: '06:50 - 14:30', bg: 'bg-green-100', border: 'border-green-300', text: 'text-green-800', calc: () => 7 + 40/60 },
            'H_C': { id: 'H_C', name: 'C班 (假日)', type: 'weekend', time: '14:20 - 22:00', bg: 'bg-green-100', border: 'border-green-300', text: 'text-green-800', calc: () => 7 + 40/60 },
            'H_D': { id: 'H_D', name: 'D班 (假日)', type: 'weekend', time: '22:00 - 07:00', bg: 'bg-green-100', border: 'border-green-300', text: 'text-green-800', calc: () => 9 },
            
            // 灰底班別 (灰色)
            'G_AB': { id: 'G_AB', name: 'AB班 (灰)', type: 'grey', time: '06:50 - 14:30', bg: 'bg-gray-200', border: 'border-gray-400', text: 'text-gray-800', calc: () => 7 + 40/60 },
            'G_C': { id: 'G_C', name: 'C班 (灰)', type: 'grey', time: '14:20 - 22:00', bg: 'bg-gray-200', border: 'border-gray-400', text: 'text-gray-800', calc: () => 7 + 40/60 },
            'G_16C': { id: 'G_16C', name: '16C班 (灰)', type: 'grey', time: '16:00 - 22:00', bg: 'bg-gray-200', border: 'border-gray-400', text: 'text-gray-800', calc: () => 6 },
            
            // 特殊班別 (紫色)
            'S_A3': { id: 'S_A3', name: 'A3班', type: 'special', time: '06:50 - 11:00', bg: 'bg-purple-100', border: 'border-purple-300', text: 'text-purple-800', calc: () => 4 + 10/60 }
        };

        // --- 狀態管理 ---
        let currentDate = new Date(); 
        let shiftsData = {}; // 格式: { 'YYYY-MM-DD': 'ShiftID' }
        let selectedDateForModal = null;

        // --- DOM 元素 ---
        const monthYearDisplay = document.getElementById('monthYearDisplay');
        const calendarGrid = document.getElementById('calendarGrid');
        const totalHoursText = document.getElementById('totalHoursText');
        const progressBar = document.getElementById('progressBar');
        const shiftModal = document.getElementById('shiftModal');
        const shiftModalContent = document.getElementById('shiftModalContent');
        const modalDateDisplay = document.getElementById('modalDateDisplay');
        const shiftOptionsContainer = document.getElementById('shiftOptionsContainer');
        const toastContainer = document.getElementById('toastContainer');
        const toastMessage = document.getElementById('toastMessage');

        // --- 初始化 ---
        function init() {
            renderCalendar();
            setupEventListeners();
        }

        // --- UI 工具 ---
        function showToast(message) {
            toastMessage.textContent = message;
            toastContainer.classList.remove('hidden', 'toast-exit');
            toastContainer.classList.add('toast-enter');
            
            // 5秒後自動隱藏
            setTimeout(() => {
                toastContainer.classList.remove('toast-enter');
                toastContainer.classList.add('toast-exit');
                setTimeout(() => toastContainer.classList.add('hidden'), 300);
            }, 5000);
        }

        // --- 核心渲染功能 ---
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            const monthNames = ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"];
            monthYearDisplay.textContent = `${year}年 ${monthNames[month]}`;

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const daysInMonth = lastDay.getDate();
            const startingDayOfWeek = firstDay.getDay(); 

            calendarGrid.innerHTML = '';

            // 填補月初的空白天數
            for (let i = 0; i < startingDayOfWeek; i++) {
                const blank = document.createElement('div');
                blank.className = 'bg-transparent border border-transparent';
                calendarGrid.appendChild(blank);
            }

            let monthlyTotal = 0;

            for (let d = 1; d <= daysInMonth; d++) {
                const dayDate = new Date(year, month, d);
                const dayOfWeek = dayDate.getDay();
                const dateString = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
                
                const cell = document.createElement('div');
                cell.className = `border rounded-xl p-1 md:p-2 min-h-[80px] md:min-h-[100px] flex flex-col cursor-pointer transition-shadow hover:shadow-md bg-white ${isWeekend ? 'bg-gray-50/80 border-gray-200' : 'border-gray-200'}`;
                cell.onclick = () => openModal(dateString, dayOfWeek, d);

                const dateNum = document.createElement('div');
                dateNum.className = `text-right font-medium text-sm md:text-base ${isWeekend ? 'text-red-500' : 'text-gray-600'}`;
                
                const today = new Date();
                if (d === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                    dateNum.innerHTML = `<span class="bg-indigo-600 text-white w-6 h-6 md:w-7 md:h-7 rounded-full inline-flex items-center justify-center">${d}</span>`;
                } else {
                    dateNum.textContent = d;
                }
                cell.appendChild(dateNum);

                const shiftId = shiftsData[dateString];
                if (shiftId && SHIFTS[shiftId]) {
                    const shift = SHIFTS[shiftId];
                    const hours = shift.calc(dayOfWeek);
                    monthlyTotal += hours;

                    const shiftPill = document.createElement('div');
                    shiftPill.className = `mt-auto ${shift.bg} ${shift.border} border ${shift.text} rounded text-xs md:text-sm font-semibold p-1 md:p-1.5 text-center flex flex-col shadow-sm`;
                    
                    if (shift.id === 'OFF') {
                        shiftPill.innerHTML = `<span>${shift.name}</span>`;
                    } else {
                        shiftPill.innerHTML = `
                            <span>${shift.name}</span>
                            <span class="text-[10px] md:text-xs font-normal opacity-80 leading-tight mt-0.5">${shift.time}</span>
                            <span class="text-[10px] md:text-xs font-normal opacity-70 border-t border-black/10 mt-1 pt-0.5">${hours.toFixed(2)}h</span>
                        `;
                    }
                    cell.appendChild(shiftPill);
                }

                calendarGrid.appendChild(cell);
            }

            updateTotalHoursDisplay(monthlyTotal);
        }

        function updateTotalHoursDisplay(total) {
            totalHoursText.textContent = total.toFixed(2);
            const percentage = Math.min((total / 96) * 100, 100);
            progressBar.style.width = `${percentage}%`;
            
            if (total >= 96) {
                progressBar.classList.remove('bg-red-400');
                progressBar.classList.add('bg-green-400');
                totalHoursText.classList.remove('text-red-300');
                totalHoursText.classList.add('text-green-300');
            } else {
                progressBar.classList.remove('bg-green-400');
                progressBar.classList.add('bg-red-400');
                totalHoursText.classList.remove('text-green-300');
                totalHoursText.classList.add('text-red-300');
            }
        }

        // --- 彈出視窗 (Modal) 互動 ---
        function openModal(dateString, dayOfWeek, day) {
            selectedDateForModal = dateString;
            const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
            const dayNames = ["日", "一", "二", "三", "四", "五", "六"];
            
            modalDateDisplay.textContent = `${dateString} (星期${dayNames[dayOfWeek]})`;
            shiftOptionsContainer.innerHTML = ''; 

            // 手動選班不受智慧排班限制，讓使用者有彈性自行安排
            const availableShifts = Object.values(SHIFTS).filter(shift => {
                if (shift.type === 'off') return true;
                if (shift.type === 'grey' || shift.type === 'special') return true;
                if (isWeekend && shift.type === 'weekend') return true;
                if (!isWeekend && shift.type === 'weekday') return true;
                return false;
            });

            // 為介面分組
            const groups = {
                '休假/休息': availableShifts.filter(s => s.type === 'off'),
                '常規班別': availableShifts.filter(s => s.type === 'weekday' || s.type === 'weekend'),
                '灰底班 (任一天)': availableShifts.filter(s => s.type === 'grey'),
                '特殊班別 (A3)': availableShifts.filter(s => s.type === 'special')
            };

            const currentlySelected = shiftsData[dateString];

            for (const [groupName, shifts] of Object.entries(groups)) {
                if (shifts.length === 0) continue;

                const groupHeader = document.createElement('h3');
                groupHeader.className = 'text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 mt-4 first:mt-0';
                groupHeader.textContent = groupName;
                shiftOptionsContainer.appendChild(groupHeader);

                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-1 sm:grid-cols-2 gap-3';

                shifts.forEach(shift => {
                    const hours = shift.calc(dayOfWeek);
                    const isSelected = currentlySelected === shift.id;
                    
                    const card = document.createElement('div');
                    card.className = `p-3 rounded-xl border-2 cursor-pointer transition-all flex flex-col justify-center ${isSelected ? `border-indigo-500 bg-indigo-50 shadow-md` : `border-transparent bg-white shadow-sm hover:border-indigo-300 hover:shadow-md border-gray-100`}`;
                    card.onclick = () => selectShift(shift.id);

                    if (shift.id === 'OFF') {
                         card.innerHTML = `<div class="font-bold text-center text-lg ${shift.text}">${shift.name}</div>`;
                    } else {
                        card.innerHTML = `
                            <div class="flex justify-between items-center mb-1">
                                <span class="font-bold ${shift.text} px-2 py-0.5 rounded text-sm ${shift.bg}">${shift.name}</span>
                                <span class="text-sm font-semibold text-gray-700">${hours.toFixed(2)}h</span>
                            </div>
                            <div class="text-xs text-gray-500 mt-1">${shift.time}</div>
                        `;
                    }
                    grid.appendChild(card);
                });
                
                shiftOptionsContainer.appendChild(grid);
            }

            shiftModal.classList.remove('hidden');
            setTimeout(() => {
                shiftModal.classList.remove('opacity-0');
                shiftModalContent.classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            shiftModal.classList.add('opacity-0');
            shiftModalContent.classList.add('scale-95');
            setTimeout(() => {
                shiftModal.classList.add('hidden');
                selectedDateForModal = null;
            }, 300);
        }

        function selectShift(shiftId) {
            if (selectedDateForModal) {
                shiftsData[selectedDateForModal] = shiftId;
                renderCalendar();
                closeModal();
            }
        }

        function clearShift() {
            if (selectedDateForModal && shiftsData[selectedDateForModal]) {
                delete shiftsData[selectedDateForModal];
                renderCalendar();
                closeModal();
            }
        }

        function clearMonthlySchedule() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const prefix = `${year}-${String(month + 1).padStart(2, '0')}`;
            
            for (const key in shiftsData) {
                if (key.startsWith(prefix)) {
                    delete shiftsData[key];
                }
            }
            renderCalendar();
        }

        // --- 智慧排班核心演算法 (嚴格限制) ---
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function autoSchedule() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const prefix = `${year}-${String(month + 1).padStart(2, '0')}`;
            
            let currentTotal = 0;
            let eShiftCount = 0; // 追蹤 E 班的次數
            let preferredDays = []; // 星期一、三、六
            let fallbackDays = [];  // 星期四 (作為補充)
            
            // 1. 計算目前的時數 (保留手動排班)，並統計現有的 E 班數量
            for (let d = 1; d <= daysInMonth; d++) {
                const dateString = `${prefix}-${String(d).padStart(2, '0')}`;
                const dayDate = new Date(year, month, d);
                const dayOfWeek = dayDate.getDay();
                
                if (shiftsData[dateString]) {
                    // 尊重已經排好的班與休假
                    const shiftId = shiftsData[dateString];
                    if (SHIFTS[shiftId]) {
                        currentTotal += SHIFTS[shiftId].calc(dayOfWeek);
                        // 如果已經有手動安排的 E 班，一併計算進去
                        if (shiftId === 'W_E') {
                            eShiftCount++;
                        }
                    }
                } else {
                    // 空白天數。套用可用天數限制：
                    // 星期二(2)、星期五(5)、星期日(0) 絕對不排班。
                    if (dayOfWeek === 1 || dayOfWeek === 3 || dayOfWeek === 6) {
                        preferredDays.push({ date: dateString, dayOfWeek: dayOfWeek });
                    } else if (dayOfWeek === 4) {
                        // 星期四只能排 13:00 後，所以只允許 E 班。列入後補。
                        fallbackDays.push({ date: dateString, dayOfWeek: dayOfWeek });
                    }
                }
            }
            
            // 2. 打亂陣列，確保隨機分佈
            shuffleArray(preferredDays);
            shuffleArray(fallbackDays);
            
            // 3. 第一階段：先排滿優先天數 (星期一、三、六)
            for (const dayObj of preferredDays) {
                if (currentTotal >= 96) break;
                
                let possibleShifts = [];
                if (dayObj.dayOfWeek === 1 || dayObj.dayOfWeek === 3) { 
                    // 星期一、三：只排 A、B 班
                    possibleShifts = ['W_A', 'W_B'];
                } else if (dayObj.dayOfWeek === 6) { 
                    // 星期六：只排假日 A 班
                    possibleShifts = ['H_A'];
                }

                if (possibleShifts.length > 0) {
                    const randomShiftId = possibleShifts[Math.floor(Math.random() * possibleShifts.length)];
                    shiftsData[dayObj.date] = randomShiftId;
                    currentTotal += SHIFTS[randomShiftId].calc(dayObj.dayOfWeek);
                }
            }

            // 4. 第二階段：如果時數不足 96，利用星期四補時數 (只能排 E 班，且最多2次)
            if (currentTotal < 96) {
                for (const dayObj of fallbackDays) {
                    if (currentTotal >= 96) break;
                    if (eShiftCount >= 2) break; // 嚴格限制：E班一個月絕對不能超過 2 次
                    
                    shiftsData[dayObj.date] = 'W_E';
                    currentTotal += SHIFTS['W_E'].calc(dayObj.dayOfWeek);
                    eShiftCount++;
                }
            }
            
            // 5. 檢查是否因為條件過於嚴格導致無法達到 96 小時
            if (currentTotal < 96) {
                showToast(`無法達到 96 小時！目前僅能排滿 ${currentTotal.toFixed(2)} 小時。因排班限制極限 (含 E 班最多 2 次、二五日不排班)，請手動調整班表。`);
            }

            renderCalendar();
        }

        // --- 事件監聽綁定 ---
        function setupEventListeners() {
            document.getElementById('prevMonth').addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                renderCalendar();
            });

            document.getElementById('nextMonth').addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                renderCalendar();
            });

            document.getElementById('autoScheduleBtn').addEventListener('click', autoSchedule);
            document.getElementById('clearMonthBtn').addEventListener('click', clearMonthlySchedule);

            document.getElementById('closeModalBtn').addEventListener('click', closeModal);
            document.getElementById('cancelModalBtn').addEventListener('click', closeModal);
            document.getElementById('clearShiftBtn').addEventListener('click', clearShift);

            shiftModal.addEventListener('click', (e) => {
                if (e.target === shiftModal) closeModal();
            });
        }

        // 啟動程式
        init();
    </script>
</body>
</html>
